<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script src="script.js" defer></script>
    <div class="calculatorChasis">
      <div class="screen"><div class="result" id="display"></div></div>
      <div class="mainContainer">
        <div class="numberButtons">
          <button class = zero id="0">0</button>
          <button class = one id="1">1</button>
          <button class = two id="2">2</button>
          <button class = three id="3">3</button>
          <button class = four id="4">4</button>
          <button class = five id="5">5</button>
          <button class = six id="6">6</button>
          <button class = seven id="7">7</button>
          <button class = eight id="8">8</button>
          <button class = nine id="9">9</button>
        </div>
        <div class="operatorButtons">
          <button class = plus id="plus">+</button>
          <button class = minus id="minus">-</button>
          <button class = multiply id="multiply">*</button>
          <button class = divide id="division">/</button>
          <button class = equals id="equal">=</button>
          <button class = clear id="clear">clear</button>
        </div>
      </div>
    </div>
  </body>
</html>
